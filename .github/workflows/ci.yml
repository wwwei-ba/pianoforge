name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile the package
        run: python -m compileall -q src
      - name: Import the pure modules
        run: |
          python -c "import sys; sys.path.insert(0, 'src')"
          python -c "import sys; sys.path.insert(0, 'src'); import pianoforge.musicxml, pianoforge.quantize, pianoforge.i18n; print('pure modules ok')"
      - name: Validate the MusicXML writer
        run: |
          python -m pip install --quiet numpy
          python -c "import sys; sys.path.insert(0, 'src'); import pianoforge.musicxml; print('musicxml ok')"
